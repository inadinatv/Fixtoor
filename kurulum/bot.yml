name: Fixtoor Bot

# Bot çalışma tetikleyicileri:
#  - schedule : her saat otomatik veri güncellemesi
#  - workflow_dispatch : Actions sekmesinden elle çalıştırma
#  - push (main) : kod değişince sayfayı yeniden yayınlama
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"

# Botun ürettiği data/*.json ve index.html dosyalarını main'e geri yazabilmesi
# için contents yazma izni gerekir. Pages izinleri de aynı çalıştırmada yayın
# yapılabilmesi için burada tutulur.
permissions:
  contents: write
  pages: write
  id-token: write

# Aynı anda iki bot çalışıp birbirinin commit'ini ezmesin. Bekleyen çalışma
# iptal edilmez; maç günlerindeki tetiklemeler sırayla tamamlanır.
concurrency:
  group: fixtoor-bot
  cancel-in-progress: false

jobs:
  bot:
    name: Veri çek ve HTML üret
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bot testlerini çalıştır
        run: python -m unittest discover -s bot -p 'test_*.py' -v

      - name: Fixtoor botunu çalıştır
        env:
          # Geçici ESPN/Dailymotion arızasında son sağlam data paketi korunur;
          # sonraki zamanlanmış çalıştırma güncellemeyi yeniden dener.
          FIXTOOR_CI_GERI_DUS: "1"
          PYTHONUNBUFFERED: "1"
        run: python bot/fiktoor.py

      - name: Üretilen paketi doğrula
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("data/site-verisi.json").read_text(encoding="utf-8"))
          assert data.get("uretim"), "uretim alanı yok"
          assert data.get("lig", {}).get("slug"), "lig bilgisi yok"
          assert isinstance(data.get("haftalar"), list), "haftalar listesi yok"
          assert Path("index.html").stat().st_size > 1000, "index.html boş/eksik"
          print(f"Doğrulandı: {len(data['haftalar'])} hafta, "
                f"{sum(len(h.get('maclar', [])) for h in data['haftalar'])} maç")
          PY

      - name: Değişiklikleri işle ve gönder
        run: |
          git config user.name  "fixtoor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html data/
          if git diff --cached --quiet; then
            echo "Yeni veri yok, commit atlanıyor."
          else
            git commit -m "🤖 Fixtoor veri güncellemesi — $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Sayfa paketini hazırla
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data
          for f in logo.png logo.svg logo.jpg logo.webp; do
            if [ -f "$f" ]; then cp "$f" _site/; fi
          done
          if [ -d assets ]; then cp -r assets _site/assets; fi

      - name: Sayfayı GitHub Pages'e yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: GitHub Pages'e yayınla
    if: github.ref == 'refs/heads/main'
    needs: bot
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayinla.outputs.page_url }}
    steps:
      - name: Yayınla
        id: yayinla
        uses: actions/deploy-pages@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
